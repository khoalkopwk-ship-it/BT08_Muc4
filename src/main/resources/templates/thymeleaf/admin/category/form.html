<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{thymeleaf/layouts/admin}">
<head>
    <title th:text="${category.categoryId == null
            ? 'Thêm danh mục'
            : 'Sửa danh mục'}">
        Biểu mẫu danh mục
    </title>
</head>
<body>
<section layout:fragment="content">
    <div class="admin-title">
        <div>
            <h1 th:text="${category.categoryId == null
                    ? 'Thêm danh mục'
                    : 'Cập nhật danh mục'}">
                Danh mục
            </h1>
            <p>Nhập đầy đủ thông tin bên dưới.</p>
        </div>
    </div>

    <div class="panel">
        <form class="form-grid"
              th:action="@{/admin/categories/save}"
              th:object="${category}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden" th:field="*{categoryId}">

            <div class="alert-eco alert-eco--error form-group--full"
                 th:if="${#fields.hasGlobalErrors()}">
                <p th:each="error : ${#fields.globalErrors()}"
                   th:text="${error}"></p>
            </div>

            <div class="form-group form-group--full">
                <label for="categoryName">Tên danh mục</label>

                <input id="categoryName"
                       type="text"
                       class="form-control-eco"
                       th:classappend="${#fields.hasErrors('categoryName')}
                               ? 'input-error' : ''"
                       th:field="*{categoryName}"
                       maxlength="100"
                       placeholder="Ví dụ: Quần áo nam">

                <small class="field-error"
                       th:if="${#fields.hasErrors('categoryName')}"
                       th:errors="*{categoryName}">
                    Lỗi tên danh mục
                </small>
            </div>

            <div class="form-group">
                <label for="status">Trạng thái</label>

                <select id="status"
                        class="form-control-eco"
                        th:field="*{status}">
                    <option value="1">Hoạt động</option>
                    <option value="0">Tạm ẩn</option>
                </select>

                <small class="field-error"
                       th:if="${#fields.hasErrors('status')}"
                       th:errors="*{status}">
                    Lỗi trạng thái
                </small>
            </div>

            <div class="form-group form-group--full">
                <label for="iconFile">Icon danh mục</label>

                <input id="iconFile"
                       type="file"
                       name="iconFile"
                       class="form-control-eco"
                       accept=".jpg,.jpeg,.png,.gif,.webp">

                <small>
                    Khi sửa, để trống nếu muốn giữ icon hiện tại.
                </small>

                <img class="preview-image"
                     th:if="*{icon != null and !#strings.isEmpty(icon)}"
                     th:src="@{${'/' + category.icon}}"
                     alt="Icon hiện tại">
            </div>

            <div class="form-actions">
                <button class="btn-eco" type="submit">
                    Lưu danh mục
                </button>

                <a class="btn-eco btn-eco--light"
                   th:href="@{/admin/categories}">
                    Quay lại
                </a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
