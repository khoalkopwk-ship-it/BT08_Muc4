# file cấu hình 
spring.application.name=SpringBootCRUDJSP

# Không đưa lên github các tham số cổng port
# có thể đưa vào .gitignore hoặc .env để bảo mật
#choặc tạo một file application.properties riêng cho môi trường local và không đưa lên github
# Cấu hình cổng chạy Spring Boot trên máy local

server.port=8081

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Chỉ các view có tiền tố thymeleaf/ mới do Thymeleaf xử lý.
# Những view còn lại tiếp tục do JSP xử lý.
spring.thymeleaf.view-names=thymeleaf/*

# UTF-8 (Spring Boot 4)
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
spring.messages.encoding=UTF-8

# SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BT08_SPRING_BOOT;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Upload ảnh
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=7MB
app.upload-dir=${UPLOAD_DIR:uploads}

# Cấu hình gửi mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cấu hình tài khoản admin
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:123456}
app.admin.email=${ADMIN_EMAIL:admin@example.com}

# ==================================================
# OPENAPI 3 - SWAGGER UI
# ==================================================

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Sắp xếp giao diện Swagger
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true

# Không hiển thị Swagger Petstore mặc định
springdoc.swagger-ui.disable-swagger-default-url=true

# Cho phép Swagger gửi CSRF token
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN